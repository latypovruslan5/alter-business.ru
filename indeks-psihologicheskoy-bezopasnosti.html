    const limitsHtml = r.limits.map(l => `<li style="position:relative; padding-left:18px; font-size:18px; line-height:1.5; color:#6A7088;"><span style="position:absolute; left:0; top:7px; width:6px; height:6px; border-radius:50%; background:#B4BBAE;"></span>${esc(l)}</li>`).join('');
    const formatsHtml = r.formats.map(f => `<div class="format-card" style="display:flex; flex-direction:column; background:#fff; border:1px solid #ECEFEA; border-radius:20px; padding:26px 24px; transition:transform .22s, box-shadow .22s;">
        <span style="align-self:flex-start; font-size:15px; font-weight:600; color:${f.badgeColor}; background:${f.badgeBg}; padding:6px 15px; border-radius:30px; margin-bottom:14px;">${esc(f.badge)}</span>
        <div style="font-family:'Futura PT','Futura Fallback'; font-size:22px; font-weight:600; line-height:1.25; letter-spacing:-0.3px; color:#282C3E; margin-bottom:10px;">${esc(f.title)}</div>
        <div style="font-size:18px; line-height:1.55; color:#4C516B; margin-bottom:20px; flex:1; text-wrap:pretty; white-space:pre-line;">${esc(f.text)}</div>
        <a class="btn-outline-green" href="${f.href}" target="_blank" rel="noopener" style="align-self:flex-start; display:inline-block; background:#fff; border:1.5px solid #29B981; color:#239266; font-weight:700; font-size:18px; padding:11px 24px; border-radius:40px; transition:background .18s, color .18s;">${esc(f.btn)}</a>
      </div>`).join('');
    const ratingScale = Array.from({ length: 10 }, (_, i) => {
      const n = i + 1; const sel = state.rating === n;
      return `<button type="button" class="rating-btn" data-rating="${n}" style="min-height:48px; border-radius:12px; border:1.5px solid ${sel ? '#239266' : '#E4E7E2'}; background:${sel ? '#EAF7F0' : '#fff'}; color:${sel ? '#239266' : '#3A3F58'}; font-size:16px; font-weight:700; cursor:pointer; transition:all .14s;">${n}</button>`;
    }).join('');
    const ratingBody = state.rating != null ? `<div style="margin-top:24px; padding-top:24px; border-top:1px solid #ECEFEA;">
        <label style="display:block; font-size:18px; font-weight:600; color:#282C3E; margin-bottom:10px;">Что можно улучшить? Что вам понравилось?</label>
        <textarea id="ratingComment" maxlength="1500" placeholder="Напишите несколько слов о вопросах, рекомендациях или удобстве инструмента" style="width:100%; min-height:96px; padding:14px 16px; border:1.5px solid #E4E7E2; border-radius:14px; font-size:18px; font-family:'Futura PT','Futura Fallback'; color:#282C3E; resize:vertical;">${esc(state.ratingComment)}</textarea>
        <div style="display:flex; align-items:center; gap:16px; margin-top:16px; flex-wrap:wrap;">
          <button id="submitRatingBtn" ${state.ratingSubmitted ? 'disabled' : ''} style="cursor:pointer; border:none; font-weight:700; font-size:18px; padding:13px 28px; border-radius:40px; background:#239266; color:#fff; opacity:${state.ratingSubmitted ? 0.6 : 1};">Отправить отзыв</button>
          ${state.ratingSubmitted ? `<span style="font-size:18px; font-weight:600; color:#239266;">Спасибо, отзыв отправлен</span>` : ''}
        </div>
      </div>` : '';

    return `<div style="${entryAnim(".45s")}">
      <div>
        <div style="background:#fff; border:1px solid #ECEFEA; border-radius:24px; padding:36px 34px;">
          <div style="display:flex; flex-wrap:wrap; gap:36px; align-items:center;">
            <div style="flex-shrink:0; ${isNewStep ? 'animation:popIn .5s ease;' : ''}">
              <div style="width:168px; height:168px; border-radius:50%; background:${r.ringStyle}; display:flex; align-items:center; justify-content:center;">
                <div style="width:132px; height:132px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                  <div style="font-family:'Futura PT Cond'; font-weight:700; font-size:58px; line-height:1; letter-spacing:-2px; color:${r.statusColor};">${r.index}</div>
                  <div style="font-size:15px; font-weight:500; letter-spacing:1.4px; text-transform:uppercase; color:#9AA0B5; margin-top:4px;">из 100</div>
                </div>
              </div>
            </div>
            <div style="flex:1; min-width:280px;">
              <div style="display:inline-flex; align-items:center; gap:9px; padding:8px 17px; border-radius:30px; background:${r.statusBg}; color:${r.statusColor}; font-size:15px; font-weight:600; margin-bottom:14px;"><span style="width:8px; height:8px; border-radius:50%; background:${r.statusColor};"></span>${esc(r.levelName)}</div>
              <p style="font-size:18px; line-height:1.55; color:#3A3F58; margin:0 0 18px; text-wrap:pretty;">${esc(r.levelDesc)}</p>
              <div style="display:inline-flex; align-items:center; gap:10px; font-size:15px; font-weight:500; color:#5A607A;">Надёжность результата:<span style="padding:5px 14px; border-radius:30px; background:${r.relBg}; color:${r.relColor}; font-weight:600;">${esc(r.relLabel)}</span></div>
              <p style="font-size:18px; line-height:1.5; color:#8A90A6; margin:10px 0 0; max-width:460px; text-wrap:pretty;">${esc(r.relNote)}</p>
            </div>
          </div>
        </div>

        ${critical}

        <div style="background:#fff; border:1px solid #ECEFEA; border-radius:24px; padding:30px 32px; margin-top:16px;">
          <div style="font-size:15px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:#9AA0B5; margin-bottom:24px;">Профиль психологической безопасности</div>
          <div style="display:flex; flex-direction:column; gap:22px;">${profileRows}</div>
        </div>

        <div style="background:#fff; border:1px solid #ECEFEA; border-radius:24px; padding:30px 32px; margin-top:16px;">
          <div style="font-size:15px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:#9AA0B5; margin-bottom:16px;">Главный вывод</div>
          <p style="font-size:22px; line-height:1.45; color:#282C3E; margin:0; text-wrap:pretty;">${esc(r.conclusion)}</p>
          <div style="margin-top:24px; padding:22px 24px; background:#F5F7F5; border-radius:18px;">
            <div style="font-size:15px; font-weight:600; color:#6A7088; margin-bottom:14px;">На чём основан вывод</div>
            <ul style="list-style:none; display:flex; flex-direction:column; gap:10px;">${groundsHtml}</ul>
          </div>
        </div>

        <div style="position:relative; overflow:hidden; background:#fff; border:1px solid #ECEFEA; border-radius:24px; padding:32px; margin-top:16px;">
          <div style="position:absolute; top:0; left:0; right:0; height:4px; background:${r.mainAccent};"></div>
          <div style="font-size:15px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:${r.mainAccent}; margin:6px 0 10px;">Главная зона внимания · ${esc(r.mainName)}</div>
          <h3 style="font-family:'Futura PT','Futura Fallback'; font-weight:600; font-size:26px; line-height:1.25; letter-spacing:-0.6px; margin:0 0 12px; color:#282C3E; text-wrap:pretty;">${esc(r.mainTitle)}</h3>
          <p style="font-size:18px; line-height:1.55; color:#4C516B; margin:0 0 26px; text-wrap:pretty;">${esc(r.mainDesc)}</p>
          <div style="font-size:15px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:#239266; margin-bottom:16px;">Рекомендации от Alter</div>
          <div style="display:flex; flex-direction:column; gap:14px;">${mainRecsHtml}</div>
          <div style="margin-top:26px; padding:20px 22px; background:${r.mainTint}; border-radius:18px;">
            <div style="font-size:15px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:${r.mainAccent}; margin-bottom:8px;">С чего начать</div>
            <div style="font-size:18px; line-height:1.55; color:#3A3F58; text-wrap:pretty;">${esc(r.mainStart)}</div>
          </div>
        </div>

        ${second}
        ${overload}

        <div style="background:#fff; border:1px solid #ECEFEA; border-radius:24px; padding:30px 32px; margin-top:16px;">
          <div style="font-size:15px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:#9AA0B5; margin-bottom:20px;">Как понять, что ситуация меняется</div>
          <div class="signs-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:16px 22px;">${signsHtml}</div>
        </div>

        <div style="background:#F5F7F5; border:1px solid #ECEFEA; border-radius:20px; padding:24px 26px; margin-top:16px;">
          <div style="font-size:15px; font-weight:600; color:#6A7088; margin-bottom:14px;">Что нельзя утверждать по этому результату</div>
          <ul class="limits-grid" style="list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:10px 22px;">${limitsHtml}</ul>
        </div>

        <div style="margin-top:44px;">
          <h3 style="font-family:'Futura PT','Futura Fallback'; font-weight:700; font-size:42px; letter-spacing:-0.8px; margin:0 0 10px; color:#282C3E;">Поддержка от Alter для бизнеса</h3>
          <p style="font-size:18px; line-height:1.5; color:#6A7088; margin:0 0 26px; max-width:660px; text-wrap:pretty;">Подходящие форматы под ваш результат. Поддержка сотрудников дополняет изменения в управлении и процессах, но не заменяет их.</p>
          <div class="formats-grid" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;">${formatsHtml}</div>
        </div>
      </div>

      <div class="rating-card" style="background:#fff; border:1px solid #ECEFEA; border-radius:24px; padding:30px 32px; margin-top:44px;">
        <h3 style="font-family:'Futura PT','Futura Fallback'; font-weight:600; font-size:26px; letter-spacing:-0.4px; margin:0 0 8px; color:#282C3E;">Насколько полезен был этот инструмент?</h3>
        <p style="font-size:18px; line-height:1.5; color:#6A7088; margin:0 0 22px; max-width:640px;">Поставьте оценку от 1 до 10. Она поможет улучшать вопросы и рекомендации инструмента.</p>
        <div style="display:grid; grid-template-columns:repeat(10, 1fr); gap:8px;">${ratingScale}</div>
        <div style="display:flex; justify-content:space-between; gap:16px; margin-top:10px;">
          <span style="font-size:18px; color:#8A90A6;">Совсем не помог</span>
          <span style="font-size:18px; color:#8A90A6;">Очень помог</span>
        </div>
        ${ratingBody}
      </div>

      <div class="share-card" style="display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-top:16px; padding:26px 30px; background:#EAF7F0; border-radius:20px;">
        <p style="margin:0; max-width:600px; font-size:18px; line-height:1.5; color:#1B7A54;"><b style="display:block; font-size:20px; font-weight:600; color:#282C3E; margin-bottom:6px;">Понравился инструмент? Поделитесь с коллегами-HR и руководителями команд</b>Отправьте ссылку руководителям — им он поможет самостоятельно оценить безопасность в своих отделах. Или коллегам HR из других компаний.</p>
        <button id="shareBtn" class="btn-outline-green" style="cursor:pointer; font-weight:700; font-size:18px; padding:13px 26px; border-radius:40px; border:1.5px solid #29B981; background:#fff; color:#239266; white-space:nowrap; transition:background .18s, color .18s;">${state.shareCopied ? 'Ссылка скопирована' : 'Скопировать ссылку'}</button>
      </div>

      <div style="display:flex; gap:14px; margin-top:36px; align-items:center; flex-wrap:wrap;">
        <button id="restartBtn" class="btn-ghost" style="cursor:pointer; font-weight:700; font-size:18px; padding:13px 28px; border-radius:40px; border:1.5px solid #D8DCD8; background:#fff; color:#5A607A; transition:all .18s;">Пройти заново</button>
        <button id="printBtn" class="btn-ghost" style="cursor:pointer; font-weight:700; font-size:18px; padding:13px 28px; border-radius:40px; border:1.5px solid #D8DCD8; background:#fff; color:#5A607A; transition:all .18s;">Распечатать</button>
        <span style="font-size:18px; line-height:1.5; color:#9AA0B5; max-width:460px; text-wrap:pretty;">Результат основан на наблюдениях HR. Он помогает сформулировать гипотезы и зоны для проверки, но не заменяет анонимный опрос сотрудников.</span>
      </div>
    </div>`;
  }

  function bindContainerEvents() {
    const c = el('container');
    c.querySelectorAll('.ctx-opt').forEach(b => b.addEventListener('click', () => setContext(b.dataset.q, b.dataset.val)));
    c.querySelectorAll('.src-btn').forEach(b => b.addEventListener('click', () => toggleSource(b.dataset.val)));
    c.querySelectorAll('.scale-btn').forEach(b => b.addEventListener('click', () => setAnswer(b.dataset.key, Number(b.dataset.val))));
    c.querySelectorAll('.nd-btn').forEach(b => b.addEventListener('click', () => setAnswer(b.dataset.key, 'nd')));
    c.querySelectorAll('.sig-btn').forEach(b => b.addEventListener('click', () => setSignal(b.dataset.key, b.dataset.val)));
    const startBtn = el('startBtn'); if (startBtn) startBtn.addEventListener('click', start);
    const restartBtn = el('restartBtn'); if (restartBtn) restartBtn.addEventListener('click', restart);
    const printBtn = el('printBtn'); if (printBtn) printBtn.addEventListener('click', () => window.print());
    const shareBtn = el('shareBtn'); if (shareBtn) shareBtn.addEventListener('click', shareLink);
    c.querySelectorAll('.rating-btn').forEach(b => b.addEventListener('click', () => setRating(Number(b.dataset.rating))));
    const ratingComment = el('ratingComment');
    if (ratingComment) ratingComment.addEventListener('input', () => { state.ratingComment = ratingComment.value; });
    const submitRatingBtn = el('submitRatingBtn'); if (submitRatingBtn) submitRatingBtn.addEventListener('click', submitRating);
  }

  function render() {
    const step = state.step;
    isNewStep = step !== lastStep;
    lastStep = step;
    let html = renderProgress();
    if (step === 0) html += renderCover();
    else if (step === 1) html += renderContext();
    else if (step === 2) html += renderSources();
    else if (step >= 3 && step <= 6) html += renderBlock(step - 3);
    else if (step === 7) html += renderSignals();
    else if (step === 8) html += renderResults();
    el('container').innerHTML = html;
    bindContainerEvents();

    const showNav = step >= 1 && step <= 7;
    const navEl = el('fixedNav');
    navEl.classList.toggle('hidden', !showNav);
    if (showNav) {
      const ready = canProceed();
      const validating = state.validateStep === step;
      el('nextBtn').textContent = step === 7 ? "Показать результат" : "Далее";
      el('nextBtn').style.opacity = ready ? 1 : 0.55;
      const answeredCount = Object.values(state.context).filter(Boolean).length + (state.sources.length > 0 ? 1 : 0) + Object.keys(state.answers).length + Object.keys(state.signals).length;
      const hintEl = el('navHint');
      hintEl.textContent = (!ready && validating) ? "Ответьте на все вопросы, чтобы продолжить" : ("Отвечено " + answeredCount + " из 25");
      hintEl.style.color = (!ready && validating) ? "#C2453A" : "#8A90A6";
    }
  }

  el('prevBtn').addEventListener('click', prev);
  el('nextBtn').addEventListener('click', next);
  render();
})();
</script>
</body>
</html>
